services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: chillsharp-www
    container_name: chillsharp-www
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chillsharp-static.rule=Host(`chillsharp.dev`)"
      - "traefik.http.routers.chillsharp-static.entrypoints=websecure"
      - "traefik.http.routers.chillsharp-static.tls=true"
      - "traefik.http.routers.chillsharp-static.tls.certresolver=letsencrypt"
      - "traefik.http.services.chillsharp-static.loadbalancer.server.port=80"
    networks:
      - default

networks:
  default:
    name: traefik-net
    external: true
